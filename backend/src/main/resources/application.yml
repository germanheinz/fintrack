spring:
  application:
    name: fintrack-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USERNAME:fintrack}
    password: ${DB_PASSWORD:fintrack_dev_only}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

fintrack:
  ai:
    # Below this confidence, or with an unknown category, the receipt goes to review.
    confidence-threshold: 0.7
  outbox:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 10
    lease-seconds: 60
    max-attempts: 5
    backoff-base-seconds: 5
  jwt:
    # Solo para desarrollo local. En cualquier entorno real esto viene de un
    # secrets manager, nunca de este archivo versionado.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
